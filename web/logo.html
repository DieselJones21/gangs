<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }
    .wrap {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      background: transparent;
    }
    img {
      width: 86%;
      height: 86%;
      object-fit: contain;
      background: transparent;
      border-radius: 50%;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.55));
    }
  </style>
</head>
<body>
  <div class="wrap"><img id="logo" alt="" /></div>
  <script>
    const params = new URLSearchParams(location.search);
    const src = params.get('img');
    const img = document.getElementById('logo');
    if (src) img.src = src;
  </script>
</body>
</html>
